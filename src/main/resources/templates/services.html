<html lang="en" xmlns:th="http://www.thymeleaf.org">

   <head>
      <!-- basic -->
      <meta charset="utf-8">
      <meta http-equiv="X-UA-Compatible" content="IE=edge">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name ="description" content="印刷缺陷检测_印刷品质量检_印刷检测软件_检测算法定制_二次开发接口提供_机器视觉检测">
      <meta name ="keywords" content="印刷缺陷检测,印刷品检测,印刷质量检测,机器视觉检测">
      <!-- mobile metas -->
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="viewport" content="initial-scale=1, maximum-scale=1">
      <!-- site metas -->
      <title>公司产品_印刷检测_图文检测_接口二次开发_算法定制</title>
      <meta name="keywords" content="机器视觉缺陷检测系统,检测内容包含模板对比,色差检测,OCR 文字识别,条码识别检测,二维码识别检测,脏点,白页,漏印错印等印刷缺陷检测,检测同时支持在线和离线检测,机器视觉检测">
      <meta name="description" content="印刷缺陷检测_印刷品质量检_印刷检测软件_检测算法定制_二次开发接口提供_机器视觉检测">
      <meta name="author" content="机器视觉缺陷检测系统，检测内容包含模板对比、色差检测、OCR 文字识别、条码识别检测、二维码识别检测、脏点、白页、漏印错印等印刷缺陷检测；检测同时支持在线和离线检测">
      <link th:include="common :: common_head">
   </head>
   <body>
   <div th:replace="common :: common_section"></div>
      <!-- header section end -->
      <!-- services section start -->
      <div class="services_section layout_padding">
         <div class="container">
            <h1 class="services_taital">视觉检测产品</h1>


            <div th:each="prod,iter :${product} " class="about_section layout_padding">
               <div class="container-fluid">
                  <div class="row">
                     <div class="col-md-6 ">
                        <div>
                           <h2 th:text="${prod.product_name}" class="about_taital"></h2>
                           <p th:text="${prod.product_brief}" class="about_text"></p>
                           <div class="readmore_bt"><a href="#" class="a_detailpage">了解产品</a></div>
                        </div>
                     </div>
                     <div class="col-md-6 padding_right_0">
                        <div><img th:src="@{${prod.product_image}}" class="about_img" style="width: 400px;height: 400px"></div>
                     </div>
                  </div>
               </div>
            </div>

         </div>
      </div>

   <div th:replace="common :: common_end"></div>

   <div th:replace="common :: common_beinan"></div>

   <div th:replace="common :: common_src"></div>

   <img id="wechat" src="images/wechat.png" />


   <!--   </script>-->
   <script type="application/javascript">
      $(document).on("click", ".a_detailpage", function () {
         var names=$(this).parent().prev().prev().text(); // 假设.name-selector是包含名字的元素
         console.log("names = " + names)
         $.ajax({
            url: "/product/show_detailpage", // 修正这里
            type: "post",
            dataType: "json",
            data: {
               name: names
            },
            success: function (res) {
               // 处理成功响应
               // console.log("Data received:", res);
               window.location.href = "/detailpages_services";
            },
            error: function (jqXHR, textStatus, errorThrown) {
               // 处理错误响应
               alert("加载产品详情失败: " + errorThrown);
               console.log("Error details:", textStatus, errorThrown);
            }
         });
      });
   </script>

   </body>
</html>
