<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<script>
    var _hmt = _hmt || [];
    (function() {
        var hm = document.createElement("script");
        hm.src = "https://hm.baidu.com/hm.js?c0b8714daf7adbdb9ebdf185385f7e0f";
        var s = document.getElementsByTagName("script")[0];
        s.parentNode.insertBefore(hm, s);
    })();
</script>

<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="viewport" content="initial-scale=1, maximum-scale=1">

    <title>深树荫</title>
    <meta name="keywords" content="机器视觉缺陷检测系统,检测内容包含模板对比,色差检测,OCR 文字识别,条码识别检测,二维码识别检测,脏点,白页,漏印错印等印刷缺陷检测,检测同时支持在线和离线检测,机器视觉检测">
    <meta name="description" content="印刷缺陷检测_印刷品质量检_印刷检测软件_检测算法定制_二次开发接口提供_机器视觉检测">
    <meta name="author" content="深树荫">
    <link th:include="common :: common_head">
</head>
<body>

<div th:replace="common :: common_section"></div>

<div class="services_section layout_padding">
    <div class="container">
        <h1 class="services_taital">行业新闻&专业知识 </h1>
        <div th:each="prod,iter :${solution} " class="about_section layout_padding">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-md-6 ">
                        <div>
                            <h2 th:text="${prod.solution_name}" class="about_taital">了解新闻</h2>
                            <p th:text="${prod.solution_brief}" class="about_text"></p>
                            <div class="readmore_bt"><a href="#" class="a_detailpage">了解新闻&专业知识</a></div>
                        </div>
                    </div>
                    <div class="col-md-6 padding_right_0">
                        <div><img th:src="@{${prod.solution_image}}" class="about_img" style="width: 670px;height: 400px"></div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<div th:replace="common :: common_end"></div>

<div th:replace="common :: common_beinan"></div>

<div th:replace="common :: common_src"></div>
<script type="application/javascript">

    $(document).on("click",".a_detailpage",function () {
        var names=$(this).parent().prev().prev().text();
        $.ajax({
            url:"/solution/show_detailpage",
            type:"post",
            dataType:"json",
            data:{
                name:names
            },
            success:function (data) {
                window.location.href = "/detailpages_services";
            }
        })
    })
</script>
</body>
</html>
